<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f2fd">
  <title>Звук — Микстейпы</title>
  <link rel="stylesheet" href="styles.css?v=20260922-card-play">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="assets/glow.js?v=3-all-cards"></script>
  <script src="app.js?v=20260922-glow" type="module"></script>
</head>
<body>
  <main class="app" aria-label="Музыкальные микстейпы">
    <div id="glow-background" aria-hidden="true"></div>
    <section class="carousel" aria-label="Подборки: листайте влево или вправо" aria-roledescription="карусель" tabindex="0"></section>
    <section class="controls" aria-label="Аудиоплеер">
      <div class="song-row">
        <div class="song" aria-live="polite"><h1 id="song-title">Загрузка треков…</h1><p id="artist"></p></div>
        <div class="actions"><button id="tracklist" aria-label="Открыть список треков"><span class="icon list"></span></button><button id="save" aria-label="Добавить трек в избранное" aria-pressed="false"><span class="icon heart"></span></button></div>
      </div>
      <div class="progress"><input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Позиция воспроизведения" disabled><div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div></div>
      <div class="transport"><button id="prev" aria-label="Предыдущий трек"><span class="icon next previous"></span></button><button id="play" aria-label="Воспроизвести"><span class="icon play"></span></button><button id="next" aria-label="Следующий трек"><span class="icon next"></span></button></div>
    </section>
  </main>
  <p id="status" role="status" hidden></p>
  <dialog id="playlist"><div class="dialog-heading"><h2>Треки подборки</h2><button id="dismiss">Готово</button></div><div id="tracks"></div></dialog>
  <audio id="audio" preload="metadata"></audio>
</body>
</html>
